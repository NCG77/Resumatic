services:
  - type: web
    name: resumatic-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: resumatic-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        # Render provides a default host, we'll allow all for the moment 
        # or it can be set to the specific onrender.com domain
        value: "*"
      - key: FRONTEND_URL
        # REPLACE THIS with your actual Vercel URL
        value: "https://your-frontend.vercel.app"

databases:
  - name: resumatic-db
    databaseName: resumatic
    user: resumatic_user
    plan: free
    region: oregon
